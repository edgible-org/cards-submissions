name: check

# Checks a submitted card on GitHub's own machines. The pull request's files are only read here,
# never run: the lifecycle test happens after a maintainer has read the card and promoted it into
# Edgible's own repository (see CONTRIBUTING.md, What happens next). pull_request (not
# pull_request_target), so a fork's pull request gets a read-only token and no secrets.

on:
  pull_request:

permissions:
  contents: read

jobs:
  check-cards:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/checkout@v4
        with:
          repository: edgible-org/card-kit
          path: .card-kit
      - name: One card folder, nothing else
        if: github.event_name == 'pull_request'
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          files=$(git diff --name-only "$BASE"...HEAD)
          [ -n "$files" ] || { echo "::error::this pull request changes no files"; exit 1; }
          echo "$files"
          if printf '%s\n' "$files" | grep -qv '^[a-z0-9][a-z0-9-]*/'; then
            echo "::error::a submission changes one card folder only. Files outside a card folder (top-level files, .github/) are maintained by Edgible: say in an issue what should change."
            exit 1
          fi
          dirs=$(printf '%s\n' "$files" | cut -d/ -f1 | sort -u)
          if [ "$(printf '%s\n' "$dirs" | wc -l)" -ne 1 ]; then
            echo "::error::a submission changes one card folder; this one changes: $(printf "%s\n" "$dirs" | paste -sd " " -)"
            exit 1
          fi
          [ -f "$dirs/card.yml" ] || { echo "::error::$dirs has no card.yml"; exit 1; }
      - name: check-cards
        # The same check every official card passes; the maintainer reads the rest before promoting.
        run: .card-kit/run check-cards --fresh
